name: mymedrecord

services:
  # 1. Base de Datos Relacional PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: mymedrecord_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mymedrecord
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - mymedrecord_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mymedrecord"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Interfaz Web pgAdmin 4 (Para ver y administrar la base de datos visualmente)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mymedrecord_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mymedrecord.cl
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mymedrecord_network
    restart: unless-stopped

networks:
  mymedrecord_network:
    driver: bridge

volumes:
  postgres_data:
